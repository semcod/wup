[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl2wup"
version = "0.1.0"
description = "WUP control DSL — query, validate, map deps and patch config"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "wup>=0.2.0",
    "uri2wup>=0.1.0",
    "protobuf>=5.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
codegen = ["grpcio-tools>=1.60", "pydantic>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
dsl2wup = "dsl2wup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dsl2wup" = ["schema/commands/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
