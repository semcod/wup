version: '3'

tasks:
  wup:watch:
    desc: "Watch project for file changes and run WUP regression tests"
    cmds:
      - uv run --no-sync wup watch

  wup:status:
    desc: "Show dependency map status and configuration"
    cmds:
      - uv run --no-sync wup status

  wup:sync:
    desc: "Discover monitoring targets and update wup.yaml manifest"
    cmds:
      - uv run --no-sync wup sync-testql . --write

  wup:endpoints:
    desc: "Verify TestQL scenarios and discover endpoints"
    cmds:
      - uv run --no-sync wup testql-endpoints

  wup:map:
    desc: "Build dependency map from codebase"
    cmds:
      - uv run --no-sync wup map-deps

  test:
    desc: "Run WUP pytest test suite"
    cmds:
      - uv run --no-default-groups --group test pytest

  lint:
    desc: "Run the locked Ruff quality check"
    cmds:
      - uv run --no-default-groups --group test ruff check .

  deps:test:
    desc: "Install only the reproducible test lane"
    cmds:
      - uv sync --locked --no-default-groups --group test

  deps:automation:
    desc: "Install optional Goal, Koru and cost tooling"
    cmds:
      - uv sync --locked --no-default-groups --group automation

  wup:service:install:
    desc: "Install and start the persistent WUP TestQL watcher"
    cmds:
      - ./scripts/install-wup-watcher-service.sh
