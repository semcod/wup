      description: 'The deployed OneDev profile for semcod/wup runs only the locked-manifest
        gate. PR #5 at 730fb747b104224265e3caf62f7be692c06e9581 fails exact merge-result
        validation with LOCKED_MANIFEST_DIFF_SCOPE_MISMATCH because it changes application
        code and refreshes pyproject.toml/uv.lock. The profile also pins the old main
        digests, so it cannot validate dependency updates.\n\nAcceptance criteria:\n1.
        Replace or extend the WUP local verification profile with a protected, networkless
        exact-merge-result suite that covers the repository''s supported Python matrix
        and required dependency lock checks.\n2. Keep the profile''s scope and immutable
        dependency inputs explicit; do not use a mutable host checkout or a self-reported
        status.\n3. Deploy the profile through the OneDev configuration process and
        obtain a successful canary status for a deliberately valid WUP PR.\n4. Add
        a regression test for the profile and document the supported change classes.'
