      description: 'The deployed OneDev profile for semcod/wup runs only the locked-manifest gate. PR #5 at 730fb747b104224265e3caf62f7be692c06e9581 fails exact merge-result validation with LOCKED_MANIFEST_DIFF_SCOPE_MISMATCH because it changes application code and refreshes pyproject.toml/uv.lock. The profile also pins the old main digests, so it cannot validate dependency updates.


        Acceptance criteria:

        1. Replace or extend the WUP local verification profile with a protected, networkless exact-merge-result suite that covers root WUP on Python 3.10+ and workspace packages on their declared Python 3.11+ floor, plus required dependency lock checks.

        2. Bake a pinned wheelhouse for the selected test group into the protected image; the suite must not depend on a mutable host cache or network access.

        3. Keep the profile scope and immutable dependency inputs explicit; do not use a mutable host checkout or a self-reported status.

        4. Deploy through the OneDev configuration process and obtain a successful canary status for a deliberately valid WUP PR.

        5. Add a regression test for the profile and document supported change classes.'
