[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wup"
version = "0.2.85"
description = "WUP (What's Up) - Intelligent file watcher for regression testing in large projects"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Tom Sapletta", email = "tom@sapletta.com"},
]
keywords = ["wup", "watcher", "testing", "regression", "file-monitoring"]
dependencies = [
    "watchdog>=4.0.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license = "Apache-2.0"

[project.optional-dependencies]
# ``dev`` remains the lightweight, broadly compatible test extra for pip users.
# Tooling that talks to issue trackers or LLMs is opt-in through ``automation``.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "httpx>=0.27",
    "uri2wup",
    "dsl2wup",
    "nlp2wup",
    "cli2wup",
    "mcp2wup",
    "rest2wup",
]
automation = [
    "goal>=2.1.0; python_version >= '3.12'",
    "koru>=0.1.461; python_version >= '3.12'",
    "costs>=0.1.20",
]
visual = [
    "playwright>=1.40,<2",
]
control = [
    "dsl2wup>=0.1.0",
    "uri2wup>=0.1.0",
]

[dependency-groups]
# The protected test lane must remain small enough to be baked into a
# networkless CI image. Keep LLM/cost tooling in the separate automation group.
test = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "httpx>=0.27",
    "uri2wup",
    "dsl2wup",
    "nlp2wup",
    "cli2wup",
    "mcp2wup",
    "rest2wup",
]
automation = [
    "goal>=2.1.0; python_full_version >= '3.12'",
    "koru>=0.1.461; python_full_version >= '3.12'",
    "costs>=0.1.20",
]
dev = [
    { include-group = "test" },
    { include-group = "automation" },
]

[tool.uv.workspace]
members = [
    ".",
    "packages/uri2wup",
    "packages/dsl2wup",
    "packages/nlp2wup",
    "packages/cli2wup",
    "packages/mcp2wup",
    "packages/rest2wup",
]

[tool.uv.sources]
wup = { workspace = true }
uri2wup = { workspace = true }
dsl2wup = { workspace = true }
nlp2wup = { workspace = true }
cli2wup = { workspace = true }
mcp2wup = { workspace = true }
rest2wup = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
python_files = ["test_*.py"]
addopts = "-ra --tb=short"

[tool.ruff.lint]
# Start with Ruff's stable Pyflakes/pycodestyle correctness baseline. Broader
# modernization and complexity families can be enabled incrementally.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"packages/dsl2wup/src/dsl2wup/v1/*_pb2.py" = ["E402", "F401"]

[tool.setuptools.packages.find]
include = ["wup*"]

[project.scripts]
wup = "wup.bootstrap:main"

[project.urls]
Homepage = "https://github.com/semcod/wup"
Repository = "https://github.com/semcod/wup"

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
