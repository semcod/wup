# WUP configuration for this repository.  Keep TestQL scenarios and the Planfile
# incident queue in the same repository so an observed regression becomes a runnable ticket.
project:
  name: wup
  description: WUP regression watcher and Planfile incident queue

watch:
  paths:
    - wup/**
    - packages/**
    - pyproject.toml
    - Taskfile.yml
  exclude_patterns:
    - '*.md'
    - '*.txt'
    - tests/**
    - node_modules/**
    - .planfile/**
    - .wup/**

services:
  - name: wup-shell
    type: shell
    root: .
    paths:
      - wup/**
      - packages/**
      - pyproject.toml
      - Taskfile.yml
    quick_tests:
      scope: all
      max_endpoints: 1
      scenario: cli-wup.testql.toon.yaml
    detail_tests:
      scope: all
      max_endpoints: 1
      scenario: cli-smoke.testql.toon.yaml

test_strategy:
  quick:
    debounce_s: 2
    max_queue: 5
    timeout_s: 15
  detail:
    debounce_s: 10
    max_queue: 1
    timeout_s: 45

testql:
  scenario_dir: testql-scenarios
  smoke_scenario: cli-smoke.testql.toon.yaml
  health_scenario: cli-smoke.testql.toon.yaml
  health_scenario_strict: true
  output_format: json
  # TestQL expects milliseconds. The old implicit value was 10 ms.
  extra_args: ["--timeout", "10000"]
  probe_interval_s: 60

planfile:
  enabled: true
  command: planfile
  sprint: current
  priority: high
  source: wup
  dedupe_file: .wup/planfile-tickets.json
  labels: [koru, llm-ready, wup, auto-diag]
  # Only tickets marked for GitHub are synchronized; historical tickets
  # without this integration remain local.
  integrations: [github]
  sync_on_change: true
  complete_on_recovery: true

# BEGIN WUP MONITORING MANIFEST (auto-generated — do not edit; run: wup sync-testql --write)
monitoring:
  generated_at: '2026-09-14T13:59:40Z'
  generated_by: wup sync-testql --write (or wup watch startup)
  how_to_refresh: wup sync-testql . --write
  probe_interval_s: 60
  health_scenario: cli-smoke.testql.toon.yaml
  base_url: (set testql.base_url or WUP_BASE_URL)
  endpoint_discovery: true
  scenario_dir: testql-scenarios
  service_map_globs: []
  docker_compose_files: []
  semcod_tools:
    enabled: false
    tools: {}
  wup_services:
    wup-shell:
      wup_paths:
      - wup/**
      - packages/**
      - pyproject.toml
      - Taskfile.yml
      docker: []
      live_probes: []
      testql_dry_run_scenarios: []
  docker_not_mapped_to_wup: []
  troubleshooting:
    probe_failed_check:
    - Czy kontener z sekcji docker jest uruchomiony (docker ps)?
    - Czy host_ports mapuje na URL w live_probes (np. 8100 vs 8202)?
    - Czy błąd dotyczy proxy frontendu (/firmware na :8100) vs bezpośredniego :8202?
    - 'Czy endpoint jest w live_probes — jeśli nie, uruchom: wup sync-testql . --write'
    config_vs_runtime: Pole live_probes to faktyczne żądania HTTP WUP. Jeśli endpointu
      tu nie ma, WUP go nie sprawdza — to błąd konfiguracji, nie aplikacji.
# END WUP MONITORING MANIFEST
