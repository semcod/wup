# WUP Configuration for CLI Testing
# Generated automatically by wup init-cli
# Project: c2004

project:
  name: c2004
  description: Auto-generated config for c2004
watch:
  paths:
  - app/**
  - src/**
  - routes/**
  exclude_patterns:
  - '*.md'
  - '*.txt'
  - tests/**
  - node_modules/**
  file_types: []
services:
- name: iter1-api
  type: web
  paths: []
  root: ''
  quick_tests:
    scope: read
    max_endpoints: 3
  detail_tests:
    scope: all
    max_endpoints: 10
- name: iter1-shell
  type: shell
  paths: []
  root: ''
  quick_tests:
    scope: all
    max_endpoints: 3
  detail_tests:
    scope: all
    max_endpoints: 10
- name: iter7-auto
  type: web
  paths: []
  root: ''
  quick_tests:
    scope: read,write
    max_endpoints: 5
  detail_tests:
    scope: all
    max_endpoints: 10
- name: iter7-shell
  type: shell
  paths: []
  root: ''
  quick_tests:
    scope: all
    max_endpoints: 5
  detail_tests:
    scope: all
    max_endpoints: 10
- name: wup-shell
  type: shell
  paths: []
  root: /home/tom/github/semcod/wup
  quick_tests:
    scope: all
    max_endpoints: 1
  detail_tests:
    scope: all
    max_endpoints: 2
test_strategy:
  quick:
    debounce_s: 2
    max_queue: 5
    timeout_s: 10
  detail:
    debounce_s: 10
    max_queue: 1
    timeout_s: 30
testql:
  scenario_dir: testql-scenarios
  smoke_scenario: iter1-api-v3-smoke.testql.toon.yaml
  output_format: json
  probe_interval_s: 0
